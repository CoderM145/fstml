<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>F Simulator</title>
<style>
/* =========================================================
   班主任模拟器 · 视觉系统（深色 / 现代简约）
   ========================================================= */
:root{
  /* 底色层次：越往后越"高" */
  --bg:#070a10; --bg2:#0c1119; --card:#111823; --card2:#161e2b; --card3:#1c2634;
  --line:#1e2836; --line2:#2a3646; --line3:#3a4a60;
  --txt:#eaf0f8; --dim:#8b98ad; --dim2:#5d6a7e;
  /* 主色 */
  --acc:#2dd4bf; --acc2:#38bdf8; --acc3:#a78bfa;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --pink:#f472b6;
  --r:16px; --r2:12px; --r3:9px;
  --sh-sm:0 1px 2px rgba(0,0,0,.4);
  --sh:0 4px 16px rgba(0,0,0,.35);
  --sh-lg:0 20px 60px rgba(0,0,0,.6);
  --ease:cubic-bezier(.22,.85,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;padding:0;background:var(--bg);color:var(--txt);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior:none;
min-height:100vh;
background-image:
  radial-gradient(1000px 560px at 8% -8%, rgba(45,212,191,.14), transparent 62%),
  radial-gradient(820px 480px at 96% 2%, rgba(56,189,248,.11), transparent 60%),
  radial-gradient(700px 500px at 50% 108%, rgba(167,139,250,.09), transparent 62%);
background-attachment:fixed;background-repeat:no-repeat}
.hidden{display:none!important}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}

/* 滚动条 */
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#2b3646,#222b38);border-radius:99px;border:1.5px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#3a4a60,#2b3646);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ===== 布局 ===== */
#game{display:flex;min-height:100vh;flex-direction:column}
#topbar{position:sticky;top:0;z-index:60;
background:linear-gradient(180deg,rgba(9,13,20,.96),rgba(9,13,20,.82));
backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
border-bottom:1px solid var(--line);padding:9px 16px;
box-shadow:0 1px 0 rgba(255,255,255,.03),0 8px 28px -12px rgba(0,0,0,.7)}
.tb-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tb-title{font-weight:800;font-size:15px;letter-spacing:.4px;
background:linear-gradient(100deg,var(--txt),#b9c6d8);-webkit-background-clip:text;background-clip:text;
-webkit-text-fill-color:transparent}
.tb-sub{color:var(--dim);font-size:12px}
.tb-stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
/* 嵌套子卡 */
.card .card.sub-card{background:linear-gradient(165deg,rgba(16,22,32,.9),rgba(10,14,21,.9));
border-color:var(--line);box-shadow:none}
/* 班级徽章 */
.cls-badge{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:flex;align-items:center;
justify-content:center;font-weight:900;font-size:17px;color:#04140f;letter-spacing:-.5px;
box-shadow:0 4px 14px -4px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.25)}
/* 高考进度条 */
.gk-track{height:3px;border-radius:99px;background:#1a2230;margin-top:8px;overflow:hidden;
box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.gk-track>i{display:block;height:100%;border-radius:99px;
background:linear-gradient(90deg,var(--acc),var(--acc2) 55%,var(--acc3));transition:width .6s var(--ease)}
/* 侧栏班级档案 */
.side-info{margin-top:auto;padding:11px 12px;background:var(--card);border:1px solid var(--line);flex:0 0 auto;
border-radius:var(--r2)}
.side-info .si-t{font-size:11.5px;color:var(--acc);font-weight:700;letter-spacing:.6px;margin-bottom:8px}
.side-info .si-r{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;
padding:4px 0;color:var(--dim)}
.side-info .si-r b{color:var(--txt);font-variant-numeric:tabular-nums}

/* ===== Chip ===== */
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);
border-radius:99px;padding:3.5px 11px;font-size:12px;white-space:nowrap;transition:.18s var(--ease)}
.chip b{font-weight:700;font-variant-numeric:tabular-nums}
.chip i{font-style:normal;color:var(--dim)}
.chip.on{color:var(--acc);border-color:rgba(45,212,191,.38);background:rgba(45,212,191,.10);
box-shadow:0 0 0 1px rgba(45,212,191,.06) inset}
.chip.good{color:var(--good);border-color:rgba(52,211,153,.36);background:rgba(52,211,153,.10)}
.chip.warn{color:var(--warn);border-color:rgba(251,191,36,.34);background:rgba(251,191,36,.10)}
.chip.bad{color:var(--bad);border-color:rgba(248,113,113,.36);background:rgba(248,113,113,.10)}

/* ===== 侧栏 ===== */
#body{display:flex;flex:1;min-height:0}
#sidebar{width:196px;flex:0 0 196px;border-right:1px solid var(--line);padding:14px 10px;
background:linear-gradient(180deg,rgba(12,17,25,.7),rgba(12,17,25,.35));
position:sticky;top:calc(var(--tbh,62px) + 10px);align-self:flex-start;
/* 撑满左侧：上留 10px 呼吸，下沿紧贴视口底部，内容不足时也不留空隙 */
max-height:calc(100vh - var(--tbh,62px) - 10px);
min-height:calc(100vh - var(--tbh,62px) - 10px);
height:auto;overflow:auto;overscroll-behavior:contain;
display:flex;flex-direction:column}
.side-nav{display:flex;flex-direction:column;flex:0 0 auto;padding-bottom:14px}
.nav-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r2);color:var(--dim);
font-size:13.5px;margin-bottom:4px;width:100%;text-align:left;transition:.18s var(--ease);position:relative}
.nav-i:hover{background:var(--card);color:var(--txt)}
.nav-i.on{background:linear-gradient(100deg,rgba(45,212,191,.16),rgba(56,189,248,.06));color:var(--acc);
font-weight:700;box-shadow:inset 2.5px 0 0 var(--acc)}
.nav-i.on::after{content:"";position:absolute;right:10px;width:5px;height:5px;border-radius:99px;
background:var(--acc);box-shadow:0 0 8px var(--acc)}
.nav-svg{width:17px;height:17px;flex:0 0 17px;opacity:.85;transition:.18s var(--ease)}
.nav-i:hover .nav-svg{opacity:1}
.nav-i.on .nav-svg{opacity:1;filter:drop-shadow(0 0 5px rgba(45,212,191,.55))}
.tab-svg{width:21px;height:21px;opacity:.8;transition:.18s var(--ease)}
#tabbar button.on .tab-svg{opacity:1;filter:drop-shadow(0 0 6px rgba(45,212,191,.6))}
.tab-t{font-size:10.5px}
.ph-svg{width:19px;height:19px}
.nav-b{margin-left:auto;font-size:10.5px;font-weight:800;min-width:19px;height:19px;padding:0 6px;
border-radius:99px;background:var(--acc);color:#04211f;display:inline-flex;align-items:center;justify-content:center}
.nav-b.warn{background:var(--warn);color:#2a1c05}
.nav-i.on .nav-b{box-shadow:0 0 0 2px rgba(45,212,191,.2)}
.nav-i.on .ico{filter:none}
#main{flex:1;min-width:0;padding:16px;max-width:1200px;margin:0 auto;width:100%}
#main.fadein{animation:viewIn .3s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 页头 */
.phead{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.ph-i{width:36px;height:36px;flex:0 0 36px;border-radius:11px;border:1px solid;display:flex;
align-items:center;justify-content:center;font-size:17px}
.ph-t{font-size:17px;font-weight:800;letter-spacing:.4px;line-height:1.25}
.ph-d{font-size:11.5px;color:var(--dim);margin-top:1px}
@media(max-width:820px){.ph-t{font-size:15.5px}.ph-i{width:32px;height:32px;flex:0 0 32px;font-size:15px}}
#tabbar{display:none}

/* 横屏矮视口：压缩侧栏并完全拉满左侧（顶栏下沿 → 视口底部，无空隙） */
@media(min-width:821px) and (max-height:560px){
  #sidebar{width:172px;flex:0 0 172px;padding:8px 8px 10px;
    top:var(--tbh,62px);
    height:calc(100vh - var(--tbh,62px));
    height:calc(100dvh - var(--tbh,62px));
    max-height:none;min-height:0}
  .nav-i{padding:5px 8px;font-size:12px;margin-bottom:2px;gap:8px}
  .nav-svg{width:14px;height:14px;flex:0 0 14px}
  .side-nav{padding-bottom:8px}
  /* 班级档案在矮视口下改 2 列紧凑排布，保证一屏可见 */
  .side-info{padding:7px 8px;display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}
  .side-info .si-t{grid-column:1/-1;margin-bottom:1px;font-size:10.5px}
  .side-info .si-r{font-size:10.5px;padding:1px 0}
  .side-info .si-r b{font-size:11px}
  /* 顶栏压缩：横屏垂直空间宝贵 */
  #topbar{padding:6px 12px}
  .cls-badge{width:30px;height:30px;flex:0 0 30px;border-radius:9px;font-size:14px}
  .tb-title{font-size:13.5px}
  .tb-sub{font-size:11px}
  .gk-track{margin-top:5px}
  .tb-stats{margin-top:5px;gap:6px}
  #main{padding:12px}
}
/* ===== 卡片 ===== */
.card{background:linear-gradient(165deg,var(--card) 0%,rgba(13,18,26,.92) 100%);
border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px;
box-shadow:var(--sh-sm);position:relative;transition:border-color .2s var(--ease)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.055) 20%,rgba(255,255,255,.055) 80%,transparent);
border-radius:var(--r) var(--r) 0 0;pointer-events:none}
.card:hover{border-color:var(--line2)}
.card-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.card-t h3{margin:0;font-size:14.5px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
.card-t .sub{font-size:12px;color:var(--dim)}

/* ===== 网格 ===== */
.grid{display:grid;gap:11px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.gauto{grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}

/* ===== KPI ===== */
.kpi{background:linear-gradient(160deg,var(--card2),rgba(14,20,29,.9));border:1px solid var(--line);
border-radius:var(--r2);padding:12px 13px;position:relative;overflow:hidden;transition:.2s var(--ease)}
.kpi::before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:3px;border-radius:99px;
background:linear-gradient(180deg,var(--acc),var(--acc2));opacity:.85}
.kpi:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--sh)}
.kpi .ki{font-size:12px;opacity:.7}
/* 班风气象 */
.climate-bar{padding:12px 13px}
.cli-t{font-size:11.5px;color:var(--acc);font-weight:700;letter-spacing:.6px;margin-bottom:9px}
.cli-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px 14px}
.cli-i .cli-h{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--dim);margin-bottom:4px}
.cli-i .cli-h b{font-size:13px;font-variant-numeric:tabular-nums}
.kpi.k-blue::before{background:linear-gradient(180deg,var(--acc2),#60a5fa)}
.kpi.k-purple::before{background:linear-gradient(180deg,var(--acc3),#c084fc)}
.kpi.k-warn::before{background:linear-gradient(180deg,var(--warn),#fb923c)}
.kpi.k-good::before{background:linear-gradient(180deg,var(--good),#6ee7b7)}
.kpi.k-bad::before{background:linear-gradient(180deg,var(--bad),#fb7185)}
.kpi .k{font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:4px}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.7px;margin-top:4px;font-variant-numeric:tabular-nums;
line-height:1.15}
.kpi .v small{font-size:11.5px;font-weight:600;color:var(--dim2);letter-spacing:0;margin-left:2px}
.kpi .d{font-size:11px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--dim)}

/* ===== 按钮 ===== */
.btn{background:var(--card2);border:1px solid var(--line2);border-radius:var(--r3);padding:8px 14px;font-size:13px;
transition:.16s var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.btn:hover{background:var(--card3);border-color:var(--line3);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pri{background:linear-gradient(120deg,var(--acc),var(--acc2));color:#04211f;border:none;font-weight:800;
box-shadow:0 4px 14px -4px rgba(45,212,191,.5)}
.btn.pri:hover{filter:brightness(1.08);box-shadow:0 6px 20px -4px rgba(45,212,191,.6)}
.btn.acc{background:linear-gradient(120deg,var(--acc3),#c084fc);color:#150a26;border:none;font-weight:800;
box-shadow:0 4px 14px -4px rgba(167,139,250,.5)}
.btn.acc:hover{filter:brightness(1.08)}
.btn.dgr{color:var(--bad);border-color:rgba(248,113,113,.4)}
.btn.dgr:hover{background:rgba(248,113,113,.1);border-color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn.wide{width:100%}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}

/* ===== 标签 ===== */
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:7px;background:#1b2431;color:var(--dim);
border:1px solid var(--line2);white-space:nowrap;font-weight:500}
.tag.g{color:var(--good);border-color:rgba(52,211,153,.34);background:rgba(52,211,153,.10)}
.tag.r{color:var(--bad);border-color:rgba(248,113,113,.34);background:rgba(248,113,113,.10)}
.tag.y{color:var(--warn);border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.10)}
.tag.b{color:#7dd3fc;border-color:rgba(125,211,252,.3);background:rgba(125,211,252,.09)}
.tag.p{color:var(--pink);border-color:rgba(244,114,182,.32);background:rgba(244,114,182,.09)}
.tag.a{color:var(--acc);border-color:rgba(45,212,191,.34);background:rgba(45,212,191,.10)}

/* ===== 进度条 ===== */
.bar{height:6px;border-radius:99px;background:#1a2230;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));
transition:width .5s var(--ease)}

/* ===== 表格 ===== */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:700;font-size:11.5px;letter-spacing:.4px;position:sticky;top:0;
background:linear-gradient(180deg,#141b26,#111823);z-index:2;
border-bottom:1px solid var(--line2)}
th:first-child{border-top-left-radius:var(--r3)}
th:last-child{border-top-right-radius:var(--r3)}
tbody tr{transition:background .14s}
tbody tr:nth-child(even) td{background:rgba(255,255,255,.014)}
tbody tr:hover td{background:rgba(56,189,248,.07)}
tbody tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-height:60vh;border-radius:var(--r2);border:1px solid var(--line)}
.muted{color:var(--dim)}
.mini{font-size:11.5px}
hr.sep{border:none;border-top:1px solid var(--line);margin:13px 0}

/* ===== 进度条组 ===== */
.statline{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:12.5px}
.statline .nm{width:76px;flex:0 0 76px;color:var(--dim)}
.statline .bar{flex:1}
.statline .vl{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

/* ===== 学生 ===== */
.stu-row{cursor:pointer;position:relative}
.stu-row td:first-child{font-weight:600}
tbody tr.stu-row:hover td{background:rgba(45,212,191,.09)}
.stu-row.rk-1 td:first-child b{color:#fbbf24}
.stu-row.rk-2 td:first-child b{color:#cbd5e1}
.stu-row.rk-3 td:first-child b{color:#fb923c}
/* 空状态 */
.empty{text-align:center;padding:26px 14px;color:var(--dim2);font-size:12.5px}
.empty .ei{font-size:26px;display:block;margin-bottom:8px;opacity:.5}
.avatar{width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;
font-size:12px;font-weight:800;margin-right:8px;vertical-align:middle;
box-shadow:0 2px 6px rgba(0,0,0,.35)}
.avatar.m{background:linear-gradient(140deg,#1e4a63,#16394e);color:#7dd3fc}
.avatar.f{background:linear-gradient(140deg,#472a52,#35203d);color:#f0abfc}

/* ===== 模态 ===== */
#modal-root{position:fixed;inset:0;z-index:200;display:none}
#modal-root.on{display:block}
.mask{position:absolute;inset:0;background:rgba(2,4,8,.76);backdrop-filter:blur(5px);
-webkit-backdrop-filter:blur(5px);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,94vw);
max-height:86vh;overflow:auto;
background:linear-gradient(170deg,#141b26,#0c1119);
border:1px solid var(--line2);border-radius:20px;padding:20px;box-shadow:var(--sh-lg);
animation:pop .26s var(--ease)}
.modal.wide{width:min(880px,96vw)}
/* 侧边抽屉：右侧滑出，占满高度 */
.modal.drawer{left:auto;right:0;top:0;bottom:0;transform:none;width:min(600px,100vw);
max-height:100vh;border-radius:20px 0 0 20px;padding:0;overflow:hidden;
display:flex;flex-direction:column;
box-shadow:-24px 0 70px rgba(0,0,0,.7);
animation:slideIn .3s var(--ease)}
@keyframes slideIn{from{transform:translateX(102%)}to{transform:none}}
.drawer-hd{flex:none;padding:15px 18px 12px;border-bottom:1px solid var(--line);
background:linear-gradient(170deg,rgba(23,31,44,.9),rgba(13,18,26,.9));position:relative}
.drawer-hd .x-close{top:12px;right:12px}
.drawer-bd{flex:1;overflow-y:auto;padding:14px 18px 16px;-webkit-overflow-scrolling:touch}
.drawer-ft{flex:none;padding:11px 18px;border-top:1px solid var(--line);
background:linear-gradient(0deg,rgba(18,25,36,.98),rgba(18,25,36,.85));
display:flex;gap:7px;flex-wrap:wrap;padding-bottom:calc(11px + env(safe-area-inset-bottom))}
.dw-name{font-size:19px;font-weight:800;letter-spacing:.3px;line-height:1.25}
.dw-sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.dw-score{font-size:30px;font-weight:900;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums;
background:linear-gradient(120deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;
-webkit-text-fill-color:transparent}
.dw-sec{margin-top:15px}
.dw-sec:first-child{margin-top:0}
.dw-sec-t{font-size:11.5px;font-weight:800;color:var(--acc);letter-spacing:.6px;margin-bottom:8px;
display:flex;align-items:center;gap:6px}
.dw-sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.dw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:7px}
.dw-cell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.dw-cell .t{font-size:10.5px;color:var(--dim)}
.dw-cell .v{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:1px}
.dw-tags{display:flex;gap:5px;flex-wrap:wrap}
@media(max-width:820px){
  .modal.drawer{width:100vw;border-radius:0}
}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.965)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal h2{margin:0 0 4px;font-size:18px;font-weight:800;letter-spacing:.3px;padding-right:26px}
.modal h4{margin:16px 0 8px;font-size:12.5px;color:var(--acc);letter-spacing:.6px;font-weight:700}
/* 行动选项：左侧渐变条 + 序号徽标 + 悬浮光晕 */
.m-opt{position:relative;display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);
  border-radius:var(--r2);padding:11px 13px 11px 12px;margin-bottom:8px;overflow:hidden;
  transition:.18s var(--ease);font-size:13.5px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.m-opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));opacity:.5;transition:.18s var(--ease)}
.m-opt::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120px 60px at 12% 0%,rgba(45,212,191,.10),transparent 70%);opacity:0;transition:.18s}
.m-opt:hover{background:linear-gradient(180deg,var(--card3),var(--card2));border-color:var(--acc);
  transform:translateX(3px);box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 1px rgba(45,212,191,.18)}
.m-opt:hover::before{opacity:1;width:4px}
.m-opt:hover::after{opacity:1}
.m-opt:active{transform:translateX(1px) scale(.995)}
.m-opt .mo-n{flex:0 0 auto;width:20px;height:20px;margin-top:1px;border-radius:7px;display:flex;
  align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--acc);
  background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.26);font-variant-numeric:tabular-nums}
.m-opt .mo-b{flex:1;min-width:0}
.m-opt .mo-b>b{display:block;font-size:13.5px;font-weight:700;letter-spacing:.2px;color:var(--txt)}
.m-opt .tip{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.55}
.m-opt .mo-tag{display:inline-block;margin-top:5px;font-size:10px;padding:1px 7px;border-radius:99px;
  border:1px solid var(--line3);color:var(--dim)}
.m-opt:disabled{opacity:.42;transform:none;box-shadow:none}
.m-opt:disabled:hover{border-color:var(--line2);transform:none}
/* 选项组：可选的彩色变体 */
.m-opt.warn::before{background:linear-gradient(180deg,var(--warn),#fb923c)}
.m-opt.warn .mo-n{color:var(--warn);background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.26)}
.m-opt.bad::before{background:linear-gradient(180deg,var(--bad),#fca5a5)}
.m-opt.bad .mo-n{color:var(--bad);background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.26)}
.m-opt.good::before{background:linear-gradient(180deg,var(--good),#6ee7b7)}
.m-opt.good .mo-n{color:var(--good);background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.26)}
.m-opt.pri::before{background:linear-gradient(180deg,var(--acc3),#c4b5fd)}
.m-opt.pri .mo-n{color:var(--acc3);background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.26)}
/* 选项列表容器：优化大量选项时的滚动体验 */
.opt-list{max-height:58vh;overflow:auto;margin:0 -2px;padding:2px;
  scrollbar-width:thin;scrollbar-color:var(--line3) transparent}
.opt-list::-webkit-scrollbar{width:6px}
.opt-list::-webkit-scrollbar-thumb{background:var(--line3);border-radius:99px}
.opt-hint{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim2);margin:0 0 8px}
.opt-hint i{width:5px;height:5px;border-radius:99px;background:var(--acc);opacity:.7}

.x-close{position:absolute;right:13px;top:12px;color:var(--dim);font-size:19px;line-height:1;padding:5px 7px;
border-radius:8px;transition:.15s}
.x-close:hover{color:var(--txt);background:var(--card3)}

/* ===== Toast ===== */
#toast-root{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;display:flex;
flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%;max-width:430px}
.toast{background:linear-gradient(160deg,rgba(28,37,51,.98),rgba(18,25,35,.98));
border:1px solid var(--line2);border-radius:var(--r2);padding:10px 15px;font-size:13px;
box-shadow:var(--sh-lg);animation:up .28s var(--ease);text-align:center;backdrop-filter:blur(10px)}
.toast.g{border-color:rgba(52,211,153,.45);box-shadow:0 0 0 1px rgba(52,211,153,.1),var(--sh-lg)}
.toast.r{border-color:rgba(248,113,113,.45)}
.toast.y{border-color:rgba(251,191,36,.45)}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

/* ===== 开局 ===== */
#setup{max-width:920px;margin:0 auto;padding:24px 16px 60px}
.hero{text-align:center;padding:30px 10px 24px;position:relative}
.boot-logo{width:56px;height:56px;margin:0 auto 14px;border-radius:17px;display:flex;align-items:center;
justify-content:center;font-weight:900;font-size:24px;color:#04211f;
background:linear-gradient(140deg,#2dd4bf,#38bdf8 60%,#a78bfa);
box-shadow:0 10px 32px -8px rgba(45,212,191,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.hero h1{margin:0 0 9px;font-size:32px;font-weight:900;letter-spacing:1.5px;line-height:1.25;
background:linear-gradient(115deg,#2dd4bf,#38bdf8 45%,#a78bfa 75%,#f472b6);
-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 4px 20px rgba(45,212,191,.22))}
.hero p{margin:0;color:var(--dim);font-size:13.5px;letter-spacing:.3px}
.field{margin-bottom:18px}
.field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:8px;letter-spacing:.6px;font-weight:600}
.txin{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:var(--r2);padding:11px 14px;
outline:none;font-size:14px;transition:.16s var(--ease)}
.txin:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(45,212,191,.12)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px 6px;text-align:center;
font-size:13px;transition:.16s var(--ease)}
.opt:hover{border-color:var(--line3);background:var(--card2);transform:translateY(-1px)}
.opt.on{background:linear-gradient(140deg,rgba(45,212,191,.18),rgba(56,189,248,.10));border-color:var(--acc);
color:var(--acc);font-weight:800;box-shadow:0 0 0 1px rgba(45,212,191,.15)}
.cls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;max-height:340px;overflow:auto;
padding:3px}
.cls-i{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px 8px;text-align:center;
transition:.16s var(--ease);position:relative;overflow:hidden}
.cls-i:hover{border-color:var(--line3);transform:translateY(-2px);box-shadow:var(--sh)}
.cls-i.on{border-color:var(--acc);background:linear-gradient(150deg,rgba(45,212,191,.16),rgba(56,189,248,.08));
box-shadow:0 0 0 1px rgba(45,212,191,.2),0 6px 18px -6px rgba(45,212,191,.4)}
.cls-i .cn{font-size:16px;font-weight:900;letter-spacing:-.3px}
.cls-i .ct{font-size:11px;color:var(--dim);margin-top:2px;font-weight:600}
.cls-i .cs{font-size:10px;color:var(--dim2);margin-top:2px}
.tierbar{height:3.5px;border-radius:99px;margin-top:6px;box-shadow:0 0 8px currentColor}
.legend{display:flex;gap:9px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:9px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block;box-shadow:0 0 6px currentColor}

/* ===== 图表 ===== */
.chart{width:100%;height:auto;max-height:270px;display:block;margin:0 auto}
.legend-c{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:8px}
.legend-c i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px}

/* ===== 行动面板 ===== */
.act-card{background:linear-gradient(160deg,var(--card),rgba(13,18,26,.9));border:1px solid var(--line);
border-radius:var(--r2);padding:12px;text-align:left;transition:.18s var(--ease);width:100%;position:relative;overflow:hidden}
.act-card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
background:linear-gradient(180deg,var(--acc),var(--acc2));opacity:0;transition:.18s}
.act-card:hover{border-color:var(--acc);background:var(--card2);transform:translateY(-2px);
box-shadow:0 8px 20px -8px rgba(45,212,191,.35)}
.act-card:hover::after{opacity:.9}
.act-card:disabled{opacity:.38;transform:none}
.act-card .t{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px}
.act-card .d{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.cost{font-size:11px;color:var(--acc);background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.3);
padding:1.5px 8px;border-radius:7px;white-space:nowrap;font-weight:700}
/* ===== 政策拖动条（紧凑） ===== */
.pol-wrap{display:grid;grid-template-columns:repeat(2,1fr);gap:0 24px}
.pol-i{padding:5px 0;border-bottom:1px solid var(--line)}
.pol-i:last-of-type{border-bottom:none}
.pol-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pol-n{font-size:12.5px;font-weight:700;letter-spacing:.2px}
.pol-v{font-size:11px;font-weight:800;padding:1.5px 9px;border-radius:99px;border:1px solid;
white-space:nowrap;transition:.18s var(--ease)}
.pol-ctl{padding-top:0}
.mini-slider{width:120px;display:inline-block;vertical-align:middle}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;
cursor:pointer;display:block;margin:0;outline:none}
.slider::-webkit-slider-runnable-track{height:5px;border-radius:99px;
background:linear-gradient(90deg,var(--acc) 0%,var(--acc2) var(--p,50%),#1a2230 var(--p,50%),#1a2230 100%);
box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5.5px;
border-radius:50%;background:#eaf0f8;border:3px solid var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.55);
transition:transform .14s var(--ease),box-shadow .14s}
.slider:hover::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(45,212,191,.16),0 2px 8px rgba(0,0,0,.55)}
.slider:active::-webkit-slider-thumb{transform:scale(1.14)}
.slider::-moz-range-track{height:5px;border-radius:99px;background:#1a2230;
box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.slider::-moz-range-progress{height:5px;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#eaf0f8;
border:3px solid var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.55)}
/* 刻度标签 */
.pol-ticks{position:relative;height:13px;margin-top:-2px}
.pol-ticks .tk{position:absolute;top:0;transform:translateX(-50%);font-size:10px;color:var(--dim2);
white-space:nowrap;cursor:pointer;padding:0 3px;border-radius:5px;transition:.15s var(--ease);user-select:none}
.pol-ticks .tk:hover{color:var(--txt);background:var(--card2)}
.pol-ticks .tk.on{color:var(--acc);font-weight:800;background:rgba(45,212,191,.1)}
.pol-tip{font-size:10.5px;color:var(--dim2);line-height:1.4;margin-top:0}
/* 开关行 */
.pol-sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 0;
border-top:1px solid var(--line);margin-top:2px}
.switch{display:inline-flex;align-items:center;gap:7px;flex:none;background:var(--card2);
border:1px solid var(--line2);border-radius:99px;padding:3px 10px 3px 4px;transition:.2s var(--ease)}
.switch i{width:30px;height:16px;border-radius:99px;background:#232e3d;position:relative;transition:.22s var(--ease)}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;
background:#7c8b9e;transition:.22s var(--ease)}
.switch span{font-size:11px;font-weight:700;color:var(--dim);min-width:12px}
.switch.on{border-color:rgba(45,212,191,.4);background:rgba(45,212,191,.1)}
.switch.on i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.switch.on i::after{left:16px;background:#04211f}
.switch.on span{color:var(--acc)}
@media(max-width:820px){
  .pol-wrap{grid-template-columns:1fr}
  .pol-ticks .tk{font-size:9.5px;padding:0 2px}
  .pol-tip{font-size:10.5px}
  .pol-v{font-size:10.5px;padding:1.5px 8px}
  .pol-i{padding:5px 0}
}
.pol{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.pol .pn{width:90px;flex:0 0 90px;font-size:12.5px;font-weight:600}

.warnrow{background:linear-gradient(100deg,rgba(251,191,36,.12),rgba(251,191,36,.04));

margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:.15s}

.task.done{border-color:rgba(52,211,153,.32);background:linear-gradient(160deg,rgba(16,32,25,.7),rgba(12,20,17,.7))}
.task.done::before{background:var(--good)}

.big-num{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1.2px;
background:linear-gradient(120deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;
-webkit-text-fill-color:transparent}

/* ============ 开局加载动画 ============ */
#loading{position:fixed;inset:0;z-index:380;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 520px at 50% 30%,rgba(56,189,248,.09),transparent 60%),var(--bg)}

.ld-in{text-align:center;width:min(300px,86vw)}

  box-shadow:0 10px 30px rgba(45,212,191,.3);animation:ldpop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes ldpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

function gauss(m,s){let u=0,v=0;while(u===0)u=R();while(v===0)v=R();
  return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function clamp(v,a,b){return v<a?a:v>b?b:v}

/* =========================================================
   学生生成
   ========================================================= */
let SID=1;
function makeStudent(cd,forcedLv){
  const g=R()<.5?'m':'f';
  const combo=cd.combo;
  const cb=COMBOS.find(c=>c.id===combo)||COMBOS[0];
  const lv=clamp(forcedLv!==undefined?forcedLv:gauss(cd.mean,cd.sd),18,99);
  const trs=rollTraits(R);
  const tr=trs[0];
  const ft=pick(FAMTYPES);
  const st={
    id:SID++,name:genName(g),gender:g,combo:cb.id,
    subs:[cb.f,cb.a,cb.b],
    base:n1(lv),
    dev:{},gr:{},vol:n1(clamp(gauss(4.5,2),1.2,11)),
    tal:n0(clamp(gauss(50,17),8,97)),
    dil:n0(clamp(gauss(58,16),12,98)),
    mind:n0(clamp(gauss(56,17),10,97)),
    dis:n0(clamp(gauss(60,17),10,98)),
    mot:n0(clamp(gauss(58,17),8,98)),
    stress:n0(clamp(gauss(28,12),0,72)),
    health:n0(clamp(gauss(80,12),45,100)),
    mood:n0(clamp(gauss(58,14),15,95)),
    trait:tr, traits:trs,
    rel:n0(clamp(gauss(52,12),15,88)),
    fam:{type:ft.name,sup:clamp(ft.sup+gauss(0,12),5,98),money:clamp(ft.money+gauss(0,18),5,98),
      expect:clamp(gauss(62,20),10,99)},
    board:R()<.62, status:[], hist:[], scores:null, total:0, rank:0, grank0:0,
    seat:-1, cadre:null, focus:false, met:0, acted:0, loveRisk:1, phoneRisk:1,
    growthPot:0, olympSub:null, tgt:null, flags:{}, eff:1, rel2:0
  };
  // 学科偏差
  SUBS.forEach(s=>{ st.dev[s]=n1(gauss(0,7.5)); st.gr[s]=0; });
  // 竞赛苗子单科突出
  if(trs.some(t=>t.olymp)){const s=pick(st.subs); st.dev[s]+=16; st.olympSub=s;}
  if(trs.some(t=>t.id==="talent")){st.dev["数学"]+=8;st.dev["物理"]+=6;}
  if(trs.some(t=>t.id==="art")){st.dev["语文"]+=8;}
  // 特质修正（多特质叠加）
  trs.forEach(t=>{
    const fx=t.fx||{};
    if(fx.dil)st.dil=clamp(st.dil+fx.dil,5,99); if(fx.mind)st.mind=clamp(st.mind+fx.mind,5,99);
    if(fx.dis)st.dis=clamp(st.dis+fx.dis,5,99); if(fx.tal)st.tal=clamp(st.tal+fx.tal,5,99);
    if(fx.mot)st.mot=clamp(st.mot+fx.mot,5,99); if(fx.base)st.base=clamp(st.base+fx.base,10,99);
    if(fx.stress)st.stress=clamp(st.stress+fx.stress,0,90);
    if(fx.stressR)st.stressR=(st.stressR||1)*fx.stressR;
    if(fx.rel)st.rel=clamp(st.rel+fx.rel,5,98);
    if(t.st!==undefined)st.stressRate=(st.stressRate||1)+t.st;
    if(t.vol)st.vol=clamp(st.vol*(1+t.vol),0.8,12);
    if(fx.fam){if(fx.fam.expect)st.fam.expect=clamp(st.fam.expect+fx.fam.expect,5,99);
      if(fx.fam.sup)st.fam.sup=clamp(st.fam.sup+fx.fam.sup,3,98);
      if(fx.fam.money)st.fam.money=clamp(st.fam.money+fx.fam.money,3,98);}
    if(t.risk){if(t.risk.love)st.loveRisk*=t.risk.love; if(t.risk.phone)st.phoneRisk*=t.risk.phone;}
  });
  // 成长上限：越接近上限越难提升
  st.cap = clamp(28 + st.base*0.55 + st.tal*0.22 + (trs.some(t=>t.id==="talent")?7:0), 45, 115);
  st.growthPot = clamp(0.6+(st.cap-st.base)/50, 0.6, 1.25);
  // 每科成长上限（被"培优/名师/错题本"等长期投入抬高）
  // 单科成长上限：与 64 周的实际成长量同量级，抬上限（培优/错题本/名师）才有意义
  st.pot={}; SUBS.forEach(s=>{st.pot[s]=n1(clamp(8+st.tal*0.06+gauss(0,2),5,18))});
  // 目标大学
  st.tgt = targetUni(st.base);
  return st;
}
function levelFromTotal(t,combo){
  let lo=0,hi=130;
  for(let i=0;i<50;i++){const m=(lo+hi)/2; if(totalFromLevel(m,combo)<t)lo=m; else hi=m;}
  return (lo+hi)/2;
}
/* 用真实成绩单反推 base / 各科偏差（固定剧本用） */
function makeStudentFromScores(cd,name,gender,sc){
  const st=makeStudent(cd);
  st.name=name; st.gender=gender; st.combo="物化生"; st.subs=["物理","化学","生物"];
  const tot=sc.语文+sc.数学+sc.英语+sc.物理+sc.化学+sc.生物;
  st.base=n1(levelFromTotal(tot,"物化生"));
  SUBS.forEach(s=>{ st.dev[s]=(sc[s]!==undefined)?n1(clamp(levelFromSubScore(sc[s],s)-st.base,-40,40)):0; });
  st.cap=clamp(28+st.base*0.55+st.tal*0.22+(st.trait.id==="talent"?7:0),45,115);
  st.growthPot=clamp(0.6+(st.cap-st.base)/50,0.6,1.25);

/* 特质抽取：每人 2~3 个（权重随机） */
function rollTraits(rf){
  const r=rf||R, n=r()<0.35?3:2, out=[];
  const bag=[]; TRAITS.forEach(t=>{const w=(t.w||3);for(let i=0;i<w;i++)bag.push(t)});
  let guard=0;
  while(out.length<n&&guard++<60){const t=pick(bag);if(!out.some(x=>x.id===t.id))out.push(t)}
  return out.length?out:[TRAITS[0]];
}

/* ---------- 座位 ---------- */
function seatReset(){
  G.seatCols=6;
  let order;
  const S=G.students.slice();
  if(G.policy.seat==="score"){order=S.sort((a,b)=>b.base-a.base)}
  else if(G.policy.seat==="random"){order=shuffle(S)}
  else if(G.policy.seat==="help"){ // 互助结对：高-低 交替，保证开局一致
    const srt=S.slice().sort((a,b)=>b.base-a.base);
    order=[];const a=[],b=[];srt.forEach((s,i)=>{(i%2?b:a).push(s)});
    for(let i=0;i<Math.max(a.length,b.length);i++){if(a[i])order.push(a[i]);if(b[i])order.push(b[i])}
  }
  else {order=S.sort((a,b)=>a.name.localeCompare(b.name,"zh"))}
  order.forEach((s,i)=>{s.seat=i});
  syncSeatmates();
}
/* 座位效应：前排更专注（纪律/效率），同桌互相影响（互助结对时后进生受益） */
function seatEffect(st){
  if(st.seat===undefined||st.seat<0)return {focus:1,help:1};
  const cols=G.seatCols||6;
  const row=Math.floor(st.seat/cols), rows=Math.ceil(G.students.length/cols)||1;
  // 前 1/3 排专注加成最高 +6%，最后一排 −3%
  const pos=row/Math.max(rows-1,1);
  const focus=clamp(1.06-pos*0.09,0.94,1.06);
  return {focus:focus, help:1};
}
function syncSeatmates(){
  const bySeat={};G.students.forEach(s=>{if(s.seat>=0)bySeat[s.seat]=s});
  const cols=G.seatCols||6;
  G.students.forEach(s=>{
    s.mate=null;
    if(s.seat<0)return;
    const r=Math.floor(s.seat/cols), c=s.seat%cols;
    const nb=(c%2===0)?s.seat+1:s.seat-1;               // 同桌（左右相邻）
    const cand=bySeat[nb];
    if(cand&&Math.floor(nb/cols)===r){s.mate=cand.id;cand.mateId=s.id}
  });
}
/* 互助结对生效：每周结算时，后进生获得同桌的带动 */
function applySeatHelp(){
  if(G.policy.seat!=="help")return;
  const map={};G.students.forEach(s=>map[s.id]=s);
  G.students.forEach(st=>{
    if(!st.mate)return;
    const mate=map[st.mate]; if(!mate)return;
    const my=st.base+(st.gr?0:0), ot=mate.base;
    if(ot-my>4){ // 我是较弱的一方：受益
      st.subs.concat(["语文","数学","英语"]).forEach(k=>{st.gr[k]=clamp(st.gr[k]+0.012,0,st.pot?st.pot[k]:46)});
      st.dil=clamp(st.dil+0.12,5,99);
    }else if(my-ot>4){ // 我是较强的一方：略受影响
      st.stress=clamp(st.stress+0.1,0,100);
    }
  });
}
function arrangeSeat(){
  let order;const S=G.students.slice();
  if(G.policy.seat==="score"){order=S.sort((a,b)=>(b.total||b.base)-(a.total||a.base))}
  else if(G.policy.seat==="random"){order=shuffle(S)}
  else if(G.policy.seat==="help"){ // 互助：高-低 交替
    const srt=S.sort((a,b)=>(b.total||b.base)-(a.total||a.base));
    order=[];const a=[],b=[];srt.forEach((s,i)=>{(i%2?b:a).push(s)});
    for(let i=0;i<Math.max(a.length,b.length);i++){if(a[i])order.push(a[i]);if(b[i])order.push(b[i])}

      if(r==="纪律委员")pickStu=G.students.slice().sort((a,b)=>b.dis-a.dis).find(x=>!x.cadre)||pickStu;
      if(r==="生活委员")pickStu=G.students.slice().sort((a,b)=>b.mot-a.mot).find(x=>!x.cadre)||pickStu;

function phi(z){
  const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989423*Math.exp(-z*z/2);
  let p=1-d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z>0?p:1-p;
}
function gradePoint(pct){
  let acc=0;
  for(let i=0;i<GRADE_BANDS.length;i++){
    const b=GRADE_BANDS[i];
    if(pct<acc+b.p||i===GRADE_BANDS.length-1){
      const t=clamp((pct-acc)/b.p,0,1);
      return Math.round(b.hi-t*(b.hi-b.lo));
    }
    acc+=b.p;
  }
  return 30;
}
/* 原始分 → 等级赋分 */
function rawToGrade(raw,s){
  const d=SUBJ_DIST[s]; if(!d)return raw;
  const full=FULL[s]||100;
  const z=(clamp(raw,0,full)/full-d.mu)/d.sd;
  return gradePoint(clamp(1-phi(z),0.0002,0.9999));
}
/* 等级赋分 → 原始分（二分反解，用于按成绩单反推学生水平） */
function gradeToRaw(gp,s){
  const full=FULL[s]||100;
  let lo=0,hi=full;
  for(let i=0;i<40;i++){const m=(lo+hi)/2; if(rawToGrade(m,s)<gp)lo=m; else hi=m;}
  return (lo+hi)/2;
}
/* 全市（区）排名估算 */
function cityRankOf(total,track){
  const d=CITY_TOTAL[track]||CITY_TOTAL["物理类"];
  const pct=clamp(1-phi((total-d.mu)/d.sd),0.00002,0.99998);
  return Math.max(1,Math.round(pct*CITY_SIZE));
}
function subScoreBase(L,s){
  const m=SUBM[s],d=L-L0;
  let v;
  if(d>=0) v=m.mid+m.up*Math.tanh(d/TK);
  else v=m.mid-m.dn*Math.tanh(-d/TK);
  return clamp(v,m.full*0.07,m.full);
}
function subLevel(st,s){return clamp(st.base+st.dev[s]+st.gr[s],5,125)}
function examSub(st,s,big,exact){
  const L=subLevel(st,s);
  let sc=subScoreBase(L,s);
  let mult=1;
  st.status.forEach(x=>{const d=STATUS_DEF[x.k];if(d&&d.eff.score)mult+=d.eff.score});
  mult+=(st.mind-55)*0.0008;
  mult-=Math.max(0,st.stress-52)*0.0016;
  mult-=Math.max(0,70-st.health)*0.0016;
  mult+= (G? (G.classMood-60)*0.0004:0);
  sc*=clamp(mult,0.62,1.16);
  if(!exact) sc+=gauss(0,st.vol*(big?1.15:0.8));
  sc=clamp(sc,FULL[s]*0.06,FULL[s]);
  // 再选科目按等级赋分计入（30~100）
  if(isElective(s))sc=rawToGrade(sc,s);
  return sc;
}
/* 原始分（不赋分，用于成绩单里显示"卷面分"） */
function rawSub(st,s,big,exact){
  return isElective(s)?gradeToRaw(examSub(st,s,big,exact),s):examSub(st,s,big,exact);
}
/* 总分（语数英 + 选考三科） */
function comboSubs(combo){const cb=COMBOS.find(c=>c.id===combo)||COMBOS[0];return [cb.f,cb.a,cb.b]}
function totalFromLevel(L,combo){
  let t=subScoreBase(L,"语文")+subScoreBase(L,"数学")+subScoreBase(L,"英语");
  (combo?comboSubs(combo):["物理","化学","生物"]).forEach(s=>{
    const r=subScoreBase(L,s); t+= isElective(s)?rawToGrade(r,s):r;});
  return t;
}
function otherTotal(L,combo){return totalFromLevel(L,combo)}
/* 方向：物理方向 / 历史方向（新高考分方向划线、分方向排名） */
function dirOf(combo){return (combo&&combo[0]==="物")?"sci":"lib"}
function dirName(k){return k==="sci"?"物理方向":"历史方向"}
function levelFromSubScore(score,s){
  // clamp 收紧 + 结果钳制，避免高分段 atanh 爆炸（如物理 98 分原本会解出 L=151）
  const m=SUBM[s];
  if(isElective(s))score=gradeToRaw(score,s); // 成绩单上再选科目是赋分
  let r;
  if(score>=m.mid) r=clamp((score-m.mid)/Math.max(m.up,1),-0.95,0.95);
  else r=clamp((score-m.mid)/Math.max(m.dn,1),-0.95,0.95);
  return clamp(L0+TK*Math.atanh(r), L0-2.2*TK, L0+2.2*TK);
}
function stTotal(st,big,exact){
  let t=0;const o={};
  ["语文","数学","英语"].forEach(s=>{o[s]=examSub(st,s,big,exact);t+=o[s]});
  o[st.subs[0]]=examSub(st,st.subs[0],big,exact); t+=o[st.subs[0]];
  o[st.subs[1]]=examSub(st,st.subs[1],big,exact); t+=o[st.subs[1]];
  o[st.subs[2]]=examSub(st,st.subs[2],big,exact); t+=o[st.subs[2]];
  return {t:t,o:o};
}

/* ---------- 考试 ---------- */
function exam(kind,silent){
  const big=(kind!=="week");
  const exact=!!(G.scenario&&kind==="base"&&G.exams.length===0);
  G.students.forEach(st=>{
    const r=stTotal(st,big,exact);
    if(exact&&st.fix){Object.keys(st.fix).forEach(k=>{r.o[k]=st.fix[k]});
      r.t=["语文","数学","英语"].concat(st.subs).reduce((a,k)=>a+(r.o[k]||0),0);}
    const prev=st.total;
    st.scores=r.o; st.total=r.t; st.delta=prev?r.t-prev:0;
    st.city=cityRankOf(r.t,(G.cd.dir==="sci")?"物理类":"历史类");
    if(!silent){st.hist.push({w:G.week,l:timeInfo(G.week).label,t:n0(r.t)})}
  });
  rankAll();
  G.students.slice().sort((a,b)=>b.total-a.total).forEach((st,i)=>{st.crank=i+1});
  const ACT=G.students;
  const avg=ACT.length?ACT.reduce((a,s)=>a+s.total,0)/ACT.length:0;
  const subs=["语文","数学","英语"].concat(G.students[0].subs);
  const subAvg={}; subs.forEach(s=>{subAvg[s]=ACT.reduce((a,x)=>a+(x.scores[s]||0),0)/(ACT.length||1)});
  const line=lineOf();
  const cnt={te:0,ben:0,p985:0,p211:0,qb:0,zhuan:0};
  ACT.forEach(s=>{
    if(s.total>=line.qb)cnt.qb++; if(s.total>=line.p985)cnt.p985++; if(s.total>=line.p211)cnt.p211++;
    if(s.total>=line.te)cnt.te++; if(s.total>=line.ben)cnt.ben++;
  });
  // 班级排名
  // 排名只在同一方向（物理/历史）内进行
  const myDir=G.cd.dir;
  const board=[];
  G.others.forEach(o=>{if(o.dir!==myDir)return;
    let sm=0;o.lv.forEach(l=>sm+=totalFromLevel(l+o.gr));board.push({id:o.id,tier:o.tier,avg:sm/o.lv.length})});
  board.push({id:G.cd.id,tier:G.cd.tier,avg:avg});
  board.sort((a,b)=>b.avg-a.avg);
  const grank=board.findIndex(b=>b.id===G.cd.id)+1;
  // 同类班 = 本方向内同层次；若同层次班级不足 3 个，并入层次最接近的班级组成对比组
  const ORD={C:0,B:1,A:2,S:3,Y:1}, me=ORD[G.cd.tier]!==undefined?ORD[G.cd.tier]:1;
  let same=board.filter(b=>b.tier===G.cd.tier); let wide=false;
  if(same.length<3){
    const near={};
    board.forEach(b=>{if(b.tier===G.cd.tier)return;const d=Math.abs((ORD[b.tier]!==undefined?ORD[b.tier]:1)-me);(near[d]=near[d]||[]).push(b)});
    for(let d=0;d<=3&&same.length<3;d++){if(near[d]){same=same.concat(near[d]);wide=true}}
  }
  const tierRank=same.findIndex(b=>b.id===G.cd.id)+1;
  const tierAvg=same.reduce((a,b)=>a+b.avg,0)/same.length;
  const gradeAvgAll=board.reduce((a,b)=>a+b.avg,0)/board.length;
  const rec={w:G.week,kind:kind,label:timeInfo(G.week).label,avg:n1(avg),rank:grank,tierRank:tierRank,
    tierN:same.length,tierAvg:n1(tierAvg),gradeAvg:n1(gradeAvgAll),subAvg:subAvg,cnt:cnt,line:line.name,
    dir:myDir,dirName:dirName(myDir),dirN:board.length,tierWide:wide,
    top:G.students.slice().sort((a,b)=>b.total-a.total).slice(0,5).map(s=>({n:s.name,t:n0(s.total),r:s.rank}))};
  G.exams.push(rec);
  // 学生反应
  G.students.forEach(st=>{
    const d=st.delta;
    if(d>25){st.mood=clamp(st.mood+7,0,100);st.stress=clamp(st.stress-4,0,100)}
    else if(d>8){st.mood=clamp(st.mood+3,0,100)}
    else if(d<-25){st.mood=clamp(st.mood-9,0,100);st.stress=clamp(st.stress+9*(st.stressRate||1)*(st.stressR||1),0,100)}
    else if(d<-8){st.mood=clamp(st.mood-4,0,100);st.stress=clamp(st.stress+4*(st.stressRate||1),0,100)}
    if(st.rank<=100&&st.rank>0)st.mood=clamp(st.mood+3,0,100);
  });
  // 班级氛围
  const mA=G.students.reduce((a,s)=>a+s.mood,0)/G.students.length;
  G.classMood=G.classMood*0.4+mA*0.6;
  return rec;
}

function rankAll(){
  const all=[];
  const myDir=G.cd.dir;
  for(const o of G.others){if(o.dir!==myDir)continue;for(const l of o.lv) all.push(otherTotal(l+o.gr,o.combo));}
  for(const s of G.students) all.push(s.total);
  all.sort((a,b)=>b-a);
  for(const s of G.students){
    let lo=0,hi=all.length-1,idx=all.length;
    while(lo<=hi){const mid=(lo+hi)>>1;if(all[mid]<=s.total){idx=mid;hi=mid-1}else lo=mid+1}
    s.rank=idx+1;
  }
  G.gradeN=all.length;
}
function weeklyQuizNarrate(q){

function weekQuiz(){
  // 只考本班真正开设的科目（由组合决定，不再是硬编码二选一）
  const subList=classSubjects(G.cd);

    if(p>0.85)st.mood=clamp(st.mood+1.5,0,100);

/* ---------- 每周成长 ---------- */
/* 学习效率基准：各因子取"标准学生"值时的乘积 */
/* 减压/动员类行动的边际递减：同一种手段短期内反复用，效果衰减
   （避免"减压班会 + 文体活动"每周刷就能把压力压到 10、正能量拉满的最优解） */
function reliefScale(id){
  const u=(G.cdUse&&G.cdUse[id]);
  if(!u)return 1;
  const gap=G.week-(u.w||0);
  if(gap>=4)return 1;                        // 冷却 4 周后完全恢复
  const n=u.n||1;
  return clamp(1-0.2*(n-1)-Math.max(0,3-gap)*0.08,0.3,1);
}
function markUse(id){
  if(!G.cdUse)G.cdUse={};
  const u=G.cdUse[id];
  if(u&&G.week-(u.w||0)<4)G.cdUse[id]={w:G.week,n:(u.n||1)+1};
  else G.cdUse[id]={w:G.week,n:1};
}
/* 每周成长基数（标定：最优操作 64 周约 +9~12 学业等级，对应分数 +65~90） */
let GROW_BASE=0.23;
const EFF_NOM=(function(){
  const dilF=0.45+58/110, strF=1, motF=0.72+58/230, talF=0.88+50/450,
    moodF=0.85+(58-52)/170, cohF=0.9+(55-52)/260, relF=0.92;
  return dilF*strF*motF*talF*moodF*cohF*relF;
})();

/* 早读/晚自习对成长的影响系数（此前这两条政策完全没有接入计算） */
const MEMORY_SUBS=["语文","英语","历史","政治","地理","生物"]; // 记忆/朗读受益科目
function mornFactor(sub){
  const m=G.policy.morn!==undefined?G.policy.morn:3;
  const isMem=MEMORY_SUBS.indexOf(sub)>=0;
  // 记忆类科目受早读影响大（±7%），理科受影响小（±2.5%）
  return isMem?(1+(m-3)*0.035):(1+(m-3)*0.012);
}
function eveFactor(st){
  const e=G.policy.eve!==undefined?G.policy.eve:2;
  let f=1+(e-3)*0.055;
  // 培优分层（档 3）：尖子生与后进生各得其所，两端额外受益
  if(e===3){
    const rk=st.crank||0, n=G.students.length||1;
    const head=rk<=Math.max(3,Math.round(n*0.2)), tail=rk>Math.round(n*0.75);
    if(head||tail)f*=1.06;
  }
  // 加时加练（档 5）：收益更高但疲劳累积
  return f;
}
function growStudents(){
  const tm=timeInfo(G.week), hardMul=1+tm.term*0.06;
  // 难度对成长速度的影响：轻松推进快、严苛推进慢
  const d_=G.diff===undefined?1:G.diff;
  const diffMul=[1.16,1.0,0.86][d_]||1;
  // 难度同时影响成长天花板：轻松更容易突破上限
  const diffPot=[1.20,1.0,0.86][d_]||1;
  const period=G.policy.weekend?1.12:1;
  const coh=cohOf();                       // 班级凝聚力：影响正能量与学习效率
  G.students.forEach(st=>{
    // 全员正常成长
    const r0=clamp(st.base/Math.max(st.cap,1),0,1);
    const room=clamp(1-r0*r0*0.55,0.35,1);
    const dilF=0.45+st.dil/110;
    const strF=clamp(1-Math.max(0,st.stress-38)/150,0.45,1);
    const motF=0.72+st.mot/230;
    const talF=0.88+st.tal/450;
    const moodF=0.85+(st.mood-52)/170;
    const potF=st.growthPot;
    const cohF=0.9+(coh-52)/260;           // 凝聚力
    const relF=0.92+(st.rel-50)/420;       // 与班主任的关系
    // 错题本 + 计划本：执行度越高，学习效率加成越大（两者叠加还有协同）
    const styF=1+(cuotiQ()/100)*0.06+(planQ()/100)*0.05
      +((cuotiQ()>55&&planQ()>55)?0.025:0);
    const effF=clamp(1+(st.effBonus||0),0.6,1.8)*styF;
    const seat=seatEffect(st);            // 座位：前排更专注
    let base=GROW_BASE*hardMul*diffMul*period*room*dilF*strF*motF*talF*moodF*potF*cohF*relF*effF*seat.focus;
    // 学习效率（面板可见）：状态类因子相对"标准学生"的倍数，1.0 为常态
    st.eff=n1(clamp(dilF*strF*motF*talF*moodF*cohF*relF*effF/EFF_NOM,0.25,2.2));
    st.subs.concat(["语文","数学","英语"]).forEach(s=>{
      const t=G.teachers[s]; if(!t)return;
      const tf=0.55+(t.ability/100)*0.62;
      const hwf=0.72+0.11*G.policy.hw*(t.hw/70);
      const rel=0.9+(t.relation-60)/300;
      let add=base*tf*hwf*rel*mornFactor(s)*eveFactor(st);
      const rep=repOf(s);
      if(rep){const q=repQuality(rep,s); add*= (st===rep?1+q*2.2:1+q);}
      if(s===G.player.sub)add*=1.06;       // 班主任任教科目的天然加成
      if(st.status.some(x=>x.k==="olymp")&&s===st.olympSub)add*=2.1;
      if(st.status.some(x=>x.k==="mentor"))add*=1.35;
      st.gr[s]=clamp(st.gr[s]+add,0,(st.pot?st.pot[s]:46)*diffPot);
    });
  });
  // 课代表自身成长：更自律、更有动力
  if(G.reps)Object.keys(G.reps).forEach(k=>{
    const r=G.students.find(x=>x.id===G.reps[k]);
    if(r){r.dil=clamp(r.dil+0.3,5,99);r.mot=clamp(r.mot+0.25,5,99);}
  });
  G.others.forEach(o=>{const av=o.lv.reduce((a,b)=>a+b,0)/o.lv.length;
    const f=1-clamp(av/100,0,1)*0.5;
    o.gr+=o.growth*0.13*hardMul*f*(0.9+R()*0.2)});
}
/* 成长值统一钳制：0 ~ 各科上限 pot（避免与硬编码 46 两套上限互相矛盾） */
function clampGrowth(){
  if(!G)return;
  G.students.forEach(st=>{
    if(!st.gr)return;
    SUBS.forEach(k=>{
      const cap=st.pot?st.pot[k]:46;
      if(st.gr[k]===undefined)return;
      st.gr[k]=clamp(st.gr[k],0,cap);
    });
  });
}
function evolveStatus(){
  const tm=timeInfo(G.week);
  // disP：纪律力度越大 → 违纪概率越低（1.25 → 0.85）
  const hwP=1.1+G.policy.hw*0.85, disP=1.5-G.policy.dis*0.16+((G.diff===undefined?1:G.diff)-1)*0.05;
  G.students.forEach(st=>{
    // 压力：向目标压力回归（学生有自我调节能力）
    let tgt=24+(G.policy.hw-1)*6+(tm.term>=2?10:0)+(G.policy.weekend?6:0)+(st.fam.expect-60)*0.18
      +((G.policy.morn!==undefined?G.policy.morn:3)-3)*3.0     // 早读强度
      +((G.policy.eve!==undefined?G.policy.eve:2)-2)*3.6;      // 晚自习强度
    tgt+=(50-st.mind)*0.3+(55-G.classMood)*0.15+(st.mot-50)*0.1;
    tgt+= (G.diff||1)*3.2;
    tgt*= (st.stressRate||1)*(st.stressR||1);
    st.status.forEach(x=>{const d=STATUS_DEF[x.k];if(d&&d.eff.stress)tgt+=d.eff.stress*0.95});
    tgt*= clamp(1+(G.policy.dis-3)*0.05,0.85,1.2);
    st.stress=clamp(st.stress+(clamp(tgt,4,98)-st.stress)*0.18,0,100);
    // 健康
    st.health=clamp(st.health+(st.stress>72?-1.1:0.6)+gauss(0,0.5),25,100);
    // 正能量回归
    st.mood=clamp(st.mood+(55-st.mood)*0.06+gauss(0,1.4)+(G.classMood-60)*0.02,0,100);
    // 状态倒计时
    st.status=st.status.filter(x=>{if(x.left===Infinity)return true;x.left--;return x.left>0});
    // 高危触发
    if(st.stress>=86&&!st.status.some(x=>x.k==="anx")&&R()<0.14){
      addStatus(st,"anx",ri(3,7));
    }
    if(st.stress>=80&&!st.status.some(x=>x.k==="insomnia")&&R()<0.06)addStatus(st,"insomnia",ri(2,5));
    if(st.stress>=78&&!st.status.some(x=>x.k==="tired")&&R()<0.07)addStatus(st,"tired",ri(2,5));
    if(st.health<45&&!st.status.some(x=>x.k==="ill")&&R()<0.22)addStatus(st,"ill",ri(1,3));
    // 违纪
    // 班级纪律氛围同样压制违纪（纪律力度 → classDis → 违纪率，形成一致反馈）
    const clsF=clamp(1.3-(G.classDis||60)/100*0.6,0.5,1.3);
    const p=clamp(((1-st.dis/100)*0.045*disP+(G.phone/100)*0.02*st.phoneRisk)*clsF
      +(st.status.some(x=>x.k==="phone")?0.03:0),0,0.35);
    if(R()<p){
      st.dis=clamp(st.dis-1.2,5,98);
      const tp=pick(DISC_TYPES);
      addDisc(st,tp,sevText(tp));
      if((tp==="自习玩手机"||R()<0.4)&&!st.status.some(x=>x.k==="phone")&&R()<0.5)addStatus(st,"phone",ri(2,6));
      else if(R()<0.3&&!st.status.some(x=>x.k==="phone")&&st.phoneRisk>1.5)addStatus(st,"phone",ri(2,6));
      if(G.policy.dis>=4&&R()<0.5){st.stress=clamp(st.stress+3,0,100)}
    }
    // 早恋
    if(st.loveRisk>1.2&&!st.status.some(x=>x.k==="love")&&R()<0.012*st.loveRisk*(tm.term>=2?1.4:1))
      {addStatus(st,"love",ri(4,10));}
  });
  // 学风执行度自然回落：不持续检查就会失效
  G.cuotiQ=clamp(cuotiQ()-2.0,0,100);
  G.planQ=clamp(planQ()-2.2,0,100);
  // 班级凝聚力：自然回落，但有下限（35），完全放任也不会跌到崩盘
  G.coh=clamp((G.coh===undefined?55:G.coh) -0.9 + (G.classMood-58)*0.05 + (G.classDis-60)*0.02,35,100);
  // 手机问题：自然上升，靠手机管控力度压制
  // 手机管理 1=严禁…5=放任。档位 2（统一保管）≈ 持平，越放任涨得越快
  G.phone=clamp((G.phone===undefined?32:G.phone) -0.6 + (G.diff||1)*0.75 + (G.policy.phone-2)*1.9,0,100);
  // 长期高压：不再让学生休学离班，而是持续拖累健康与成绩（焦虑/失眠/疲惫状态生效）
  G.students.forEach(st=>{
    if(st.stress>=92&&st.health>25){st.health=clamp(st.health-1.4,25,100)}
  });
  // 玩家状态
  const pt=clamp(20+(G.policy.hw-3)*5+(G.policy.dis-3)*4+(G.policy.weekend?8:0)+(tm.term>=2?8:0)
    +(G.classDis<50?8:0)+G.complains*2,5,95);
  G.stress=clamp(G.stress+(pt-G.stress)*0.25,0,100);
  G.stamina=clamp(G.stamina+(88-G.stamina)*0.14-1.5+(G.stress>70?-1.2:0)+(G.policy.hw<=2?0.8:0),10,100);
  G.parentSat=clamp(G.parentSat+(G.classMood-60)*0.03-0.1,10,100);
  G.classDis=clamp(G.classDis+(G.policy.dis-3)*1.1+(G.classMood-60)*0.05,15,100);
}

function shopAvail(it){
  const tm=timeInfo(G.week);
  if(it.need&&!it.need(G))return 0;
  const n=shopCount(it.id);
  if(it.cd==="once")return n>=it.max?0:it.max-n;
  if(it.cd==="term")return (shopTerm(it.id)===tm.term&&n>=it.max)?0:it.max-((shopTerm(it.id)===tm.term)?n:0);
  if(it.cd==="month")return (shopTerm(it.id)===G.week&&n>=it.max)?0:it.max-((shopTerm(it.id)===G.week)?n:0);
  return it.max-n;
}

  const u=G.shopUse[id]||{n:0,term:-1};

function genTasks(){
  G.tasks=G.tasks.filter(t=>t.state==="active");
  const pool=shuffle(TASK_TPL.slice());
  let n=2+ (R()<0.4?1:0);
  for(let i=0;i<n;i++){
    const tp=pool[i]; const d=tp.mk(G);
    G.tasks.push({id:tp.id,type:tp.t,title:d.title,desc:d.desc.replace("{T}",d.tgt).replace("{N}",d.N||""),
      tgt:d.tgt,key:d.key,state:"active",month:G.week,rw:{rep:ri(3,7),fund:ri(400,1200)},
      pn:{rep:ri(2,5),fund:ri(300,800)}});
  }
  G.monthIncidents=0;G.monthVisits=0;G.monthTalks=0;
}
function checkTasks(){
  const e=G.exams[G.exams.length-1];
  G.tasks.forEach(t=>{
    if(t.state!=="active")return;
    const tp=TASK_TPL.find(x=>x.id===t.id); if(!tp)return;
    const v=tp.calc(G,e,t); t.cur=v;
    const ok=tp.ok(v,t.tgt);
    t.state=ok?"done":"fail";
    if(ok){G.rep=clamp(G.rep+t.rw.rep,0,100);G.fund+=t.rw.fund;
      pushLog("task","✅ 完成任务「"+t.title+"」 声望+"+t.rw.rep+" 经费+"+t.rw.fund)}
    else{G.rep=clamp(G.rep-t.pn.rep,0,100);
      pushLog("task","❌ 未完成任务「"+t.title+"」 声望-"+t.pn.rep)}
  });
  G.tasks=G.tasks.filter(t=>t.state==="active");
}

function spendAP(n){
  if(!G||G.ap<n)return false;
  G.ap-=n;
  if(typeof save==="function")save();
  return true;
}
/* 只花钱不花 AP 的操作也走这里 */

}

function actDiscipline(){
  if(!spendAP(1))return;
  // 已满档（军事化）时收益减半，避免无脑刷
  const full=G.policy.dis>=5;
  const k=full?0.5:1;
  G.policy.dis=clamp(G.policy.dis+1,1,5);
  G.classDis=clamp(G.classDis+11*k,15,100);
  G.students.forEach(s=>{s.dis=clamp(s.dis+7*k,5,98);s.stress=clamp(s.stress+3.5,0,100);s.mood=clamp(s.mood-3,0,100)});

}

/* ---------- 学风双机制：错题本 / 计划本 ----------
   两者都是"检查"型行动：执行一次把执行度顶上去，之后每周自然回落。
   不检查就会失效，所以要么坚持、要么别开始。
------------------------------------------------- */
function cuotiQ(){return clamp(G.cuotiQ===undefined?0:G.cuotiQ,0,100)}
function planQ(){return clamp(G.planQ===undefined?0:G.planQ,0,100)}
function actCuoti(){
  if(!spendAP(1))return;
  G.flags.cuoti=(G.flags.cuoti||0)+1;
  const b=G.flags.cuoti, before=cuotiQ();
  // 执行度顶上去（越往后边际递减，避免一次刷满）
  G.cuotiQ=clamp(before+(100-before)*0.42+8,0,100);
  G.students.forEach(s=>{SUBS.forEach(k=>{if(s.pot)s.pot[k]=clamp(s.pot[k]+0.45,26,80)});
    s.dil=clamp(s.dil+1.6,5,99)});
  if(before<30)G.classDis=clamp(G.classDis+2,15,100);
  pushLog("act","检查错题本（第 "+b+" 次），执行度 "+n0(before)+" → "+n0(G.cuotiQ)+"。");
  toast("检查错题本：执行度 "+n0(G.cuotiQ)+"%，成长上限↑","g");render();
}
function actPlan(){
  if(!spendAP(1))return;
  G.flags.plan=(G.flags.plan||0)+1;
  const b=G.flags.plan, before=planQ();
  G.planQ=clamp(before+(100-before)*0.45+9,0,100);
  const q=planQ();
  G.students.forEach(s=>{
    // 越不会规划的学生（勤奋低）受益越大
    const gain=(1.4+(75-s.dil)/28);
    s.dil=clamp(s.dil+gain,5,99);
    s.stress=clamp(s.stress-1.6,0,100);
    s.mot=clamp(s.mot+1.2,0,100);
    s.effBonus=(s.effBonus||0)+0.004;
  });
  G.classDis=clamp(G.classDis+1.5,15,100);
  G.classMood=clamp(G.classMood+1.5,0,100);
  pushLog("act","检查计划本（第 "+b+" 次），执行度 "+n0(before)+" → "+n0(q)+"。");
  toast("检查计划本：执行度 "+n0(q)+"%，勤奋↑ 压力↓","g");render();
}

function weakSub(s){
  let w=null,wv=1e9;
  s.subs.concat(["语文","数学","英语"]).forEach(x=>{const v=examSub(s,x,false)/FULL[x]+rnd(0,0.05);if(v<wv){wv=v;w=x}});
  return w;
}

function doStudentAction(mode,st,optId){
  const cost=(mode==="visit")?1:1;
  const modes=TALK_MODES[mode]; const m=modes.find(x=>x.id===optId);
  if(!m)return;
  if(mode==="visit"){G.monthVisits=(G.monthVisits||0)+1;G.stats.visits++}
  else if(mode==="talk"){G.monthTalks=(G.monthTalks||0)+1;G.stats.talks++}
  const r=m.run(st);
  if(r===false)return;
  // 师生关系决定干预效果：关系好，一句话顶十句
  const rm=clamp(0.78+st.rel/260,0.7,1.25);
  st.mood=clamp(st.mood+(rm-1)*8,0,100);
  st.stress=clamp(st.stress-(rm-1)*8,0,100);
  if(st.rel<35&&mode!=="olymp")toast(st.name+"对你有距离感，沟通效果打折","y");
  st.met++;st.acted++;
  spendAP(cost); G.stress=clamp(G.stress+1,0,100); G.stamina=clamp(G.stamina-1,10,100);
  pushLog("act","对 "+st.name+" 进行了"+({talk:"谈话",visit:"家访",psy:"心理辅导",olymp:"竞赛安排"}[mode])+"："+m.n);
  toast(m.n+"：完成","g");
}

function removeStu(s){
  const i=G.students.indexOf(s);if(i>=0)G.students.splice(i,1);
  if(G.cadres){Object.keys(G.cadres).forEach(k=>{if(G.cadres[k]===s)G.cadres[k]=null})}

  if(G.reps){Object.keys(G.reps).forEach(k=>{if(G.reps[k]===s.id)delete G.reps[k]})}
  G.students.forEach(x=>{if(x.mate===s.id)x.mate=null});
  arrangeSeat(); syncSeatmates();
  pushLog("event",s.name+" 离开了班级。");
}
function fireEvent(){
  const cand=[];
  EV.forEach(e=>{
    if(e.cond&&!e.cond(G))return;
    const c=e.pick?e.pick(G):{};
    if(!c)return;
    cand.push({ev:e,ctx:c});
  });
  if(!cand.length)return null;
  let tot=0;cand.forEach(x=>{x.w=(x.ev.w||5)/(1+(G.firedEvents[x.ev.id]||0)*0.8);tot+=x.w});
  let r=R()*tot,sel=cand[0];
  for(const x of cand){r-=x.w;if(r<=0){sel=x;break}}
  return sel;
}
const DISC_EVENTS={phone:"手机违纪",fight:"打架斗殴",cheat:"考试作弊",sleep:"课堂睡觉",novel:"上课看课外书"};
function showEvent(e){

  const settle=(o)=>{
    if(_evDone)return; _evDone=true;
    if(o){o.run(c)}
    else{
      // 放任不管：事件照常发酵
      if(c.a){c.a.stress=clamp(c.a.stress+6,0,100);c.a.mood=clamp(c.a.mood-5,0,100);
        c.a.rel=clamp(c.a.rel-4,5,98)}
      if(c.b){c.b.stress=clamp(c.b.stress+4,0,100);c.b.mood=clamp(c.b.mood-4,0,100)}

      G.classDis=clamp(G.classDis-3,15,100);
      G.parentSat=clamp(G.parentSat-2,10,100);
    }
    G.firedEvents[ev.id]=(G.firedEvents[ev.id]||0)+1;
    const dt=DISC_EVENTS[ev.id];
    if(dt){if(c.a)addDisc(c.a,dt,ev.title); if(c.b)addDisc(c.b,dt,ev.title);}
    pushLog("event",ev.title+" → "+(o?o.t:"（放任不管）"));
    MODAL_LOCK=false;closeModal();render();save();
  };
  _evDone=false; _evSettle=settle;
  modal(`
   <div class="tag y" style="margin-bottom:8px">班级事件</div>
   <h2>${ev.title}</h2>
   <p style="color:#c4cddb;font-size:13.5px;margin:10px 0 4px">${ev.text(c)}</p>

      '</b><span class="tip">'+esc(o.tip||"")+'</span></span>';
    b.onclick=()=>settle(o);
    box.appendChild(b);
  });
}

/* =========================================================
   周推进
   ========================================================= */
function endWeek(forced){
  if(G.ended){return}
  const tm=timeInfo(G.week);
  const isExam=isExamWeek(G.week);
  // 周考
  if(!isExam){const q=weekQuiz();pushLog("exam","周考（"+q.sub+"）班级均分 "+q.avg);weeklyQuizNarrate(q)}
  // 成长 & 状态
  growStudents(); applySeatHelp(); evolveStatus(); clampGrowth();
  G.weekIncidents=G.weekIncidents||0;
  G.monthIncidents=(G.monthIncidents||0)+G.weekIncidents;
  G.weekIncidents=0;
  // 大考
  let rec=null;
  if(isExam){
    const kind=examKind(G.week);
    rec=exam(kind);
    pushLog("exam",EXAM_NAME[kind]+"：班级均分 "+rec.avg+"，"+rec.dirName+"第 "+rec.rank+" 名，同类班第 "+rec.tierRank+"/"+rec.tierN);
    if(kind==="gaokao"){G.gkDone=true;finishGaokao();return}
  }
  // 月末：任务结算 + 新任务
  if(isExam){
    checkTasks();
    // 家长反馈
    const d=rec.avg-(G.exams.length>1?G.exams[G.exams.length-2].avg:rec.avg);
    G.parentSat=clamp(G.parentSat+(d>0?3:-3),10,100);
    if(G.tasks.length===0)genTasks();
    else {const keep=G.tasks.filter(t=>t.state==="active");G.tasks=keep;if(keep.length<2)genTasks()}
    G.monthIncidents=0;G.monthVisits=0;G.monthTalks=0;
    const mf=monthFund();
    toast("本月班费到账 ¥"+mf,"g");
  }
  // 学期末
  if(isExam&&tm.monthInTerm===4){
    G.rep=clamp(G.rep+(rec.tierRank<=Math.ceil(rec.tierN/2)?4:-3),0,100);
    pushLog("term","学期结束。班级同类排名 "+rec.tierRank+"/"+rec.tierN);
  }
  // 事件
  G.week++;
  if(G.week>=TOTAL_WEEKS){finishGaokao();return}
  G.ap=apMax();
  save();
  const e=(R()<0.42)?fireEvent():null;
  if(e){showEvent(e)}
  render();
}
function apMax(){
  let a=4+(G.diff===0?1:0)-(G.diff===2?1:0);
  if(G.stamina>75)a+=1; if(G.stamina<35)a-=1;
  if(G.stress>78)a-=1;
  // 班长得力时多 1 点行动力（原本是恒为 +0 的未完成逻辑）
  const b=G.cadres["班长"]; if(b&&b.dis>70&&b.dil>65)a+=1;
  return clamp(a,2,6);
}
function applyGkBoost(){
  const b=G.flags.gkBoost||0; if(!b)return;
  G.students.forEach(s=>{s.subs.concat(["语文","数学","英语"]).forEach(x=>{
    const cap=s.pot?s.pot[x]:46; s.gr[x]=clamp(s.gr[x]+b*0.9,0,cap)});
    s.mind=clamp(s.mind+4,5,99)});
}
function finishGaokao(){
  PAGE="result";
  if(!G.gkDone){
    applyGkBoost();
    exam("gaokao");
    G.gkDone=true;
  }
  G.ended=true;
  G.result=buildResult();
  pushLog("system","高考结束。");
  save();render();
}

/* ---------- 结局 ---------- */
function buildResult(){
  const line=lineOf();
  const S=G.students.slice().sort((a,b)=>b.total-a.total);
  const cnt={qb:0,p985:0,p211:0,te:0,ben:0,zhuan:0,fail:0};
  S.forEach(s=>{
    if(s.total>=line.qb)cnt.qb++; if(s.total>=line.p985)cnt.p985++; if(s.total>=line.p211)cnt.p211++;
    if(s.total>=line.te)cnt.te++; if(s.total>=line.ben)cnt.ben++; else if(s.total>=line.zhuan)cnt.zhuan++; else cnt.fail++;
  });
  const avg=S.length?S.reduce((a,s)=>a+s.total,0)/S.length:0;
  const first=G.exams.length?G.exams[0].avg:avg;
  const improve=n1(avg-first);
  let score=0;
  const tier=G.cd.tier;
  const rate=(k)=>cnt[k]/(S.length||1);
  // 分层加权（权重合计 1，按各层级的考核目标分配）
  const W={
    S:{qb:0.10,p985:0.25,p211:0.30,te:0.35},
    A:{p985:0.15,p211:0.30,te:0.35,ben:0.20},
    B:{p985:0.05,p211:0.20,te:0.45,ben:0.30},
    C:{p211:0.10,te:0.35,ben:0.55},
    Y:{p211:0.10,te:0.30,ben:0.60}
  }[tier]||{p211:0.10,te:0.35,ben:0.55};
  let sc2=0;Object.keys(W).forEach(k=>{sc2+=rate(k)*W[k]});
  score=sc2*100;
  score+=clamp(improve/4,-10,16);
  score+=clamp((G.parentSat-60)/8,-6,6);
  score-=G.complains*1.5;
  score+=G.honor*1.5;
  score=clamp(score,0,100);
  let rank,title,comment;
  if(score>=80){rank="S";title="传奇班主任";comment="你的名字会被写进这所学校的招生简章。"}
  else if(score>=64){rank="A";title="名师";comment="年级会上，校长点名表扬了你的带班成绩。"}
  else if(score>=48){rank="B";title="优秀班主任";comment="学生和家长都认可你，成绩单上有拿得出手的数字。"}
  else if(score>=32){rank="C";title="合格班主任";comment="平稳完成任务，没人记得亮点，也没人记得失误。"}
  else {rank="D";title="待改进班主任";comment="述职时你讲不出几个名字，只讲得出几个数字。"}
  return {cnt:cnt,avg:n1(avg),improve:improve,score:n0(score),rank:rank,title:title,comment:comment,line:line,
    top:S.slice(0,10),coh:n0(cohOf()),rel:n0(avgRel())};
}

  let s=0,n=0;
  for(const o of G.others)for(const l of o.lv){s+=totalFromLevel(l+o.gr);n++}
  s+=G.students.reduce((a,x)=>a+x.total,0);n+=G.students.length;
  return s/n;
}

/* ---------- 图表 ---------- */
/* 所有图表共用：过滤掉 NaN / Infinity，避免脏数据把整张图画崩 */
function num(v){return (typeof v==="number"&&isFinite(v))?v:null}
let _svgUid=0;
/* 折线图：支持多序列一次性绘制（避免叠加多个 SVG 造成高度错位与渐变 id 冲突） */
function svgMulti(series,opt){
  opt=opt||{};
  series=(series||[]).map(s=>Object.assign({},s,{vals:(s.vals||[]).map(num)}))
    .filter(s=>s.vals.some(v=>v!==null));
  if(!series.length)return "";
  const w=opt.w||320,h=opt.h||130,pad=20;
  let all=[];series.forEach(s=>s.vals.forEach(v=>{if(v!==null)all.push(v)}));
  if(!all.length)return "";
  let mn=opt.min!==undefined?num(opt.min):Math.min.apply(null,all);
  let mx=opt.max!==undefined?num(opt.max):Math.max.apply(null,all);
  if(mn===null||mx===null)return "";
  if(mx-mn<1){mx+=1;mn-=1}
  const rg=mx-mn;
  const N=Math.max.apply(null,series.map(s=>s.vals.length));
  const xOf=i=>pad+(N>1?i*(w-2*pad)/(N-1):(w-2*pad)/2);
  const yOf=v=>h-pad-((v-mn)/rg)*(h-2*pad);
  const uid="sg"+(++_svgUid);
  let g="";
  for(let i=0;i<3;i++){const y=pad+i*(h-2*pad)/2;
    g+='<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="#232c3a" stroke-width="1"/>';
    g+='<text x="2" y="'+(y+3).toFixed(1)+'" fill="#5f6b7d" font-size="9">'+(mx-(mx-mn)*i/2).toFixed(0)+'</text>';}
  let defs='<defs>',body="";
  series.forEach((se,si)=>{
    const c=se.color||"#2dd4bf";
    const pts=[];se.vals.forEach((v,i)=>{if(v!==null)pts.push([xOf(i),yOf(v)])});
    if(!pts.length)return;
    if(se.fill!==false&&pts.length>1){
      const gid=uid+"_"+si;
      defs+='<linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
        +'<stop offset="0%" stop-color="'+c+'" stop-opacity="0.28"/>'
        +'<stop offset="100%" stop-color="'+c+'" stop-opacity="0"/></linearGradient>';
      const a="M"+pts[0][0].toFixed(1)+","+(h-pad)+" "+pts.map(p=>"L"+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")
        +" L"+pts[pts.length-1][0].toFixed(1)+","+(h-pad)+" Z";
      body+='<path d="'+a+'" fill="url(#'+gid+')"/>';
    }
    if(pts.length>1)body+='<polyline points="'+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+
      '" fill="none" stroke="'+c+'" stroke-width="2" stroke-linejoin="round"'+(se.dash?' stroke-dasharray="4 3"':'')+'/>';
    body+=pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="'+c+'"/>').join("");
  });
  defs+="</defs>";
  const labs=(series[0].labels||[]).map((l,i)=>{
    if(N>8&&i%Math.ceil(N/6)!==0&&i!==N-1)return "";
    return '<text x="'+xOf(i).toFixed(1)+'" y="'+(h-6)+'" fill="#5f6b7d" font-size="9" text-anchor="middle">'+l+'</text>';}).join("");
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'">'+defs+g+body+labs+'</svg>';
}
/* 单序列兼容入口 */
function svgLine(vals,opt){
  opt=opt||{};
  return svgMulti([{vals:vals,color:opt.color,fill:opt.fill,dash:opt.dash,labels:opt.labels}],
    {w:opt.w,h:opt.h,min:opt.min,max:opt.max});
}
function svgBars(items,opt){
  opt=opt||{};const w=opt.w||320,h=opt.h||140,pad=22;
  items=(items||[]).map(i=>Object.assign({},i,{v:num(i.v)})).filter(i=>i.v!==null);
  const n=items.length;if(!n)return "";
  const mx=Math.max.apply(null,items.map(i=>i.v).concat([1]));
  let mn=num(opt.base); if(mn===null)mn=0;
  const bw=(w-2*pad)/n*0.62, gap=(w-2*pad)/n;
  let s="";
  for(let i=0;i<3;i++){const y=pad+i*(h-pad-14)/2;
    s+='<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad/2)+'" y2="'+y+'" stroke="#232c3a"/>'}
  items.forEach((it,i)=>{
    const x=pad+i*gap+(gap-bw)/2;
    const bh=Math.max(2,((it.v-mn)/Math.max(mx-mn,1))*(h-pad-18));
    s+='<rect x="'+x.toFixed(1)+'" y="'+(h-14-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+
      '" rx="3" fill="'+(it.c||"#2dd4bf")+'" opacity="'+(it.o||0.85)+'"/>';
    s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-4)+'" fill="#8a95a8" font-size="9" text-anchor="middle">'+it.l+'</text>';
    if(opt.showVal)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-17-bh).toFixed(1)+'" fill="#cbd5e1" font-size="9" text-anchor="middle">'+Math.round(it.v)+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'">'+s+'</svg>';
}
function svgRadar(labels,vals,maxv){
  labels=(labels||[]);
  vals=(vals||[]).map(num);
  if(!labels.length||!vals.length||labels.length!==vals.length)return "";
  maxv=(num(maxv)||100);
  const w=300,h=180,cx=w/2,cy=h/2+4,R=62,n=labels.length;
  let s="";
  for(let r=1;r<=3;r++){
    const pts=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;pts.push([cx+Math.cos(a)*R*r/3,cy+Math.sin(a)*R*r/3])}
    s+='<polygon points="'+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'" fill="none" stroke="#232c3a"/>';
  }
  const pts=vals.map((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;const rr=R*clamp((v===null?0:v)/maxv,0,1);return [cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]});
  s+='<polygon points="'+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'" fill="rgba(45,212,191,.18)" stroke="#2dd4bf" stroke-width="1.6"/>';
  labels.forEach((l,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;const x=cx+Math.cos(a)*(R+16),y=cy+Math.sin(a)*(R+14);
    s+='<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" fill="#8a95a8" font-size="10" text-anchor="middle">'+l+'</text>';
    s+='<text x="'+(cx+Math.cos(a)*(R+26)).toFixed(1)+'" y="'+(y+10).toFixed(1)+'" fill="#2dd4bf" font-size="9" text-anchor="middle">'+(vals[i]===null?"—":Math.round(vals[i]))+'</text>';});
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'">'+s+'</svg>';
}
function svgHist(buckets){
  const w=320,h=130,pad=20;
  const mx=Math.max.apply(null,buckets.map(b=>b.n).concat([1]));
  const n=buckets.length,gap=(w-2*pad)/n,bw=gap*0.72;
  let s="";
  const cols=["#f87171","#fb923c","#fbbf24","#a3e635","#34d399","#2dd4bf","#38bdf8","#a78bfa"];
  buckets.forEach((b,i)=>{
    const bh=b.n/mx*(h-pad-24);
    const x=pad+i*gap+(gap-bw)/2;
    s+='<rect x="'+x.toFixed(1)+'" y="'+(h-22-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,bh).toFixed(1)+
      '" rx="2.5" fill="'+cols[i%cols.length]+'" opacity=".8"/>';
    if(b.n)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-25-bh).toFixed(1)+'" fill="#cbd5e1" font-size="9" text-anchor="middle">'+b.n+'</text>';
    s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-8)+'" fill="#5f6b7d" font-size="8.5" text-anchor="middle">'+b.l+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'">'+s+'</svg>';
}

      if(rq){rq.call(el);toast("已进入全屏（按 Esc 退出）","g")}

/* 各科成长：已积累 / 上限（平均值） */
function potInfo(st){
  if(!st.pot)return {g:0,p:46};
  const ks=st.subs.concat(["语文","数学","英语"]);
  let g=0,p=0;
  ks.forEach(k=>{g+=st.gr[k]||0;p+=(st.pot[k]||46)});
  return {g:n1(g/ks.length),p:n1(p/ks.length)};
}

/* 核心考核指标按班级类型而定：南山班看 985，特尖班看双一流，尖子班看一本，重点班/艺体班看本科 */
function keyLineKey(){

  return t==="S"?"p985":t==="A"?"p211":t==="B"?"te":"ben";
}
const KEYLINE_NAME={p985:"985 达线人数",p211:"双一流达线人数",te:"一本达线人数",ben:"本科达线人数"};
function keyLineName(){return KEYLINE_NAME[keyLineKey()]}
function keyLineVal(e){const k=keyLineKey();
  return k==="p985"?e.cnt.p985:k==="p211"?e.cnt.p211:k==="te"?e.cnt.te:e.cnt.ben}
function keyLineScore(){const k=keyLineKey(),l=lineOf();
  return k==="p985"?l.p985:k==="p211"?l.p211:k==="te"?l.te:l.ben}
function keyLineGoal(){
  return {S:"985 上线率",A:"双一流上线率",B:"一本上线率",C:"本科上线率",Y:"本科上线率"}[G.cd.tier]||"本科上线率";
}
function statLine(n,v){return '<div class="statline"><span class="nm">'+n+'</span><span class="bar"><i style="width:'+v+'%;background:'+stColor(v)+'"></i></span><span class="vl">'+v+'</span></div>'}
function warnReason(s){
  const r=[];
  if(s.stress>=80)r.push("压力爆表"); else if(s.stress>=68)r.push("压力偏高");
  if(s.status.some(x=>x.k==="anx"))r.push("焦虑失眠");
  if(s.status.some(x=>x.k==="phone"))r.push("沉迷手机");
  if(s.status.some(x=>x.k==="love"))r.push("早恋");
  if(s.status.some(x=>x.k==="ill"))r.push("生病");
  if(s.delta<-30)r.push("大幅退步");
  if(s.health<55)r.push("健康不佳");
  if(s.dis<35)r.push("纪律差");
  return r.join(" · ")||"状态波动";
}
function warnings(){
  return G.students.filter(s=>s.stress>=68||s.status.some(x=>["anx","phone","love","ill","punish"].indexOf(x.k)>=0)||
    s.delta<-28||s.health<55||s.dis<35||s.focus)
    .sort((a,b)=>(b.stress+b.status.length*10)-(a.stress+a.status.length*10));
}

function stuFiltered(){

  if(FILTER==="warn")list=warnings();

  else if(FILTER==="low")list=list.sort((a,b)=>a.total-b.total).slice(0,15);

  list.sort((a,b)=>{
    let va,vb;
    if(key==="total"){va=a.total||a.base*7;vb=b.total||b.base*7}

  return list;

function drawCharts(){
  const exams=G.exams.slice().filter(e=>e.kind!=="gaokao");
  const avgs=exams.map(e=>n1(e.avg));
  const gl=exams.map(()=>n0(gradeAvg()));
  const box=document.getElementById("c-line");
  if(box){
    if(!avgs.length){box.innerHTML='<div class="mini muted" style="padding:14px 0">还没有大考数据，第一次月考后这里会出现趋势曲线。</div>'}
    else{
      const all=avgs.concat(gl);
      const mn=Math.min.apply(null,all)-6,mx=Math.max.apply(null,all)+6;
      // 一次绘制（本班 + 年级基准），不再叠加多个 SVG，避免高度错位与渐变 id 冲突
      box.innerHTML=svgMulti([
        {vals:gl,color:"#a78bfa",fill:false,dash:true},
        {vals:avgs,color:"#2dd4bf",fill:true,labels:exams.map((e,i)=>(i+1))}
      ],{min:mn,max:mx,h:130});
    }
  }
  const e=lastExam(G),prev=G.exams.length>1?G.exams[G.exams.length-2]:null;
  if(!e||!G.students.length)return;
  const subs=["语文","数学","英语"].concat(G.students[0].subs);
  const r=document.getElementById("c-radar");
  if(r){
    const rv=subs.map(s=>{const v=num(e.subAvg&&e.subAvg[s]);return v===null?null:n1(v/FULL[s]*100)});
    r.innerHTML=rv.every(v=>v===null)?'<div class="mini muted">暂无数据</div>':svgRadar(subs,rv,100);
  }
  const h=document.getElementById("c-hist");
  if(h){
    const cuts=[0,400,450,500,550,600,650,700],labs=["<400","400","450","500","550","600","650","700+"];
    const bks=labs.map((l,i)=>({l:l,n:0}));
    G.students.forEach(s=>{for(let i=cuts.length-1;i>=0;i--){if(s.total>=cuts[i]){bks[i].n++;break}}});
    h.innerHTML=svgHist(bks);
  }
  const cmp=document.getElementById("c-cmp");
  if(cmp){
    const a1=num(e.avg),a2=num(e.tierAvg),a3=num(e.gradeAvg);
    if(a1===null){cmp.innerHTML='<div class="mini muted">暂无数据</div>'}
    else{
    const bs=Math.min(a1,a2,a3)*0.9;
    cmp.innerHTML=svgBars([{l:"本班",v:a1,c:"#2dd4bf"},{l:"同类班均",v:a2,c:"#a78bfa"},{l:"年级均",v:a3,c:"#64748b"}],
      {showVal:true,h:120,base:bs});}
  }
  const b=document.getElementById("c-bars");
  if(b)b.innerHTML=svgBars(subs.map(s=>{const v=num(e.subAvg&&e.subAvg[s]);
    return {l:s,v:v===null?null:n1(v/FULL[s]*100),
      c:prev&&num(prev.subAvg&&prev.subAvg[s])!==null?((e.subAvg[s]>=prev.subAvg[s])?"#34d399":"#f87171"):"#2dd4bf"}}),{showVal:true});
}

function polPct(v){return (clamp(v,1,5)-1)/4*100}
function polRow(p){
  const v=clamp(G.policy[p.k],1,5), pct=polPct(v);
  const c=p.dir===-1?(v<=2?"var(--good)":v<=3?"var(--warn)":"var(--bad)")
                    :(v>=4?"var(--warn)":v<=2?"var(--good)":"var(--acc)");
  let h='<div class="pol-i" data-pol="'+p.k+'">';
  h+='<div class="pol-h"><span class="pol-n">'+p.n+'</span>';
  h+='<span class="pol-v" style="color:'+c+';border-color:'+c+'40;background:'+c+'14">'+p.vals[v-1]+'</span></div>';
  h+='<div class="pol-ctl">';
  h+='<input class="slider" type="range" min="1" max="5" step="1" value="'+v+'" style="--p:'+pct+'%" oninput="setPol(\''+p.k+'\',this.value)">';
  h+='<div class="pol-ticks">';

    let pos;
    if(i===0)pos="left:0;transform:none";

    else pos="left:calc("+(i/4*100)+"% - "+(i/4*18-9)+"px)";
    h+='<span class="tk'+(i+1===v?" on":"")+'" style="'+pos+'" onclick="setPolVal(\''+p.k+'\','+(i+1)+')">'+t+'</span>';
  });
  h+='</div></div>';
  h+='<div class="pol-tip">'+p.tips[v-1]+'</div></div>';
  return h;
}

/* 局部刷新政策行，避免整页重绘打断拖动 */
function syncPol(k,p,v){
  const row=document.querySelector('[data-pol="'+k+'"]');
  if(!row){render();return}
  const inp=row.querySelector(".slider");
  if(inp){inp.value=v;inp.style.setProperty("--p",polPct(v)+"%")}
  row.querySelectorAll(".pol-ticks .tk").forEach(function(t,i){t.classList.toggle("on",i+1===v)});
  const badge=row.querySelector(".pol-v");
  const c=p.dir===-1?(v<=2?"var(--good)":v<=3?"var(--warn)":"var(--bad)")
                    :(v>=4?"var(--warn)":v<=2?"var(--good)":"var(--acc)");
  if(badge){badge.textContent=p.vals[v-1];badge.style.color=c;badge.style.borderColor=c+"40";badge.style.background=c+"14"}
  const tip=row.querySelector(".pol-tip"); if(tip)tip.textContent=p.tips[v-1];
}

/* ---------- 存档导出 / 导入（文本 + 文件两种方式） ---------- */
function saveFileName(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  return "班主任模拟器_存档_"+(G&&G.cd?G.cd.id+"班_":"")+
    d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes())+".json";
}
function exportSave(){
  let s="";
  try{s=localStorage.getItem(SAVEKEY)||""}catch(e){toast("读取存档失败","r");return}
  if(!s){toast("还没有存档","y");return}
  modal('<button class="x-close" data-close="1">×</button><h2>导出存档</h2>'+
   '<div class="mini muted">两种方式任选：直接下载成文件，或复制文本自己保存。</div>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+
   '<button class="btn pri" style="flex:1;min-width:130px" onclick="downloadSave()">⬇ 下载为文件（.json）</button>'+
   '<button class="btn" style="flex:1;min-width:130px" onclick="document.getElementById(\'exp-ta\').select();try{document.execCommand(\'copy\');toast(\'已复制\',\'g\')}catch(e){toast(\'请手动复制\',\'y\')}">复制文本</button>'+
   '</div>'+
   '<div class="opt-hint" style="margin-top:12px"><i></i>也可以把下面这段文本粘贴到别处保存</div>'+
   '<textarea class="txin" style="height:150px;font-size:11px" id="exp-ta">'+esc(s)+'</textarea>'+
   '<div class="mini muted" style="margin-top:10px">要导入？在下方选择文件，或把文本粘到这里后点「从文本导入」。</div>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+
   '<button class="btn" onclick="document.getElementById(\'imp-file\').click()">⬆ 从文件导入</button>'+
   '<button class="btn" onclick="importSave()">从文本导入</button></div>'+
   '<input type="file" id="imp-file" accept=".json,.txt,application/json" style="display:none" onchange="importFile(this)">');
}
function downloadSave(){
  try{
    const s=localStorage.getItem(SAVEKEY)||"";
    const blob=new Blob([s],{type:"application/json;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=saveFileName();
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},1500);
    toast("存档文件已下载","g");
  }catch(e){toast("下载失败："+e.message,"r")}
}
function importFile(inp){
  const f=inp.files&&inp.files[0];
  if(!f)return;
  const rd=new FileReader();
  rd.onload=function(){
    try{
      const o=JSON.parse(String(rd.result));
      G=normalizeG(o);G.ver=SAVE_VER;
      localStorage.setItem(SAVEKEY,JSON.stringify(G));
      closeModal();
      document.getElementById("setup").classList.add("hidden");
      document.getElementById("game").classList.remove("hidden");
      PAGE="dash";render();
      toast("导入成功："+G.cd.name+" · "+G.students.length+" 人","g");
    }catch(e){toast("导入失败：不是有效的存档文件","r")}
  };
  rd.onerror=function(){toast("读取文件失败","r")};
  rd.readAsText(f,"utf-8");
  inp.value="";
}
function importSave(){
  const ta=document.getElementById("exp-ta");
  const v=ta?ta.value.trim():"";
  if(!v){toast("请先粘贴存档文本","y");return}
  try{
    const o=JSON.parse(v);
    G=normalizeG(o);G.ver=SAVE_VER;
    localStorage.setItem(SAVEKEY,JSON.stringify(G));
    closeModal();
    document.getElementById("setup").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");
    PAGE="dash";render();
    toast("导入成功","g");
  }catch(e){toast("导入失败：格式错误或不完整","r")}
}
function quitGame(){

 {n:"班级团建游戏",d:"压力-10 凝聚+12 纪律-3",run(){const k=reliefScale("m7");markUse("m7");
   G.students.forEach(s=>{s.stress=clamp(s.stress-10*k,0,100);s.mood=clamp(s.mood+9*k,0,100)});G.coh=clamp(G.coh+12*k,10,100);G.classDis=clamp(G.classDis-3,15,100)}},
];
function openMeetingModal(){

function runMeeting(i){
